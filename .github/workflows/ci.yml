name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-public-files.py --staged
      - run: python -m unittest discover -s scripts/tests -p 'test_public_files.py'
      - run: pnpm install --frozen-lockfile
      - run: pnpm metadata:check
      - run: pnpm platform:test
      - run: pnpm platform:check
      - run: pnpm ontology:test
      - run: pnpm ontology:check
      - run: pnpm data:setup
      - run: pnpm data:test
      - run: pnpm design:check
      - run: pnpm i18n:test
      - run: pnpm site:test:unit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm site:test
